<svg xmlns="http://www.w3.org/2000/svg" width="600" height="385" viewBox="0 0 600 385" role="img" aria-label="AlfrênIA. Assistente pessoal com 14 especialistas e mais de 280 ferramentas — agenda, e-mail, finanças, estudo, conteúdo e painéis — pelo Telegram, por painel web e por voz. Corrige a si mesma: a correção nasce numa cópia isolada e só entra no ar depois de 96 verificações automáticas. (TypeScript, Node.js, SQLite, LLMs)">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111B29"/>
    </linearGradient>
    <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363D" stroke-width="1" opacity="0.28"/>
    </pattern>
    <radialGradient id="brilho" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="385" rx="12" fill="url(#fundo)"/>
  <rect width="600" height="385" rx="12" fill="url(#grade)"/>
  <rect width="600" height="385" rx="12" fill="url(#brilho)"/>
  <rect x="0.5" y="0.5" width="599" height="384" rx="12" fill="none" stroke="#30363D"/>
  <circle cx="24" cy="22" r="4.5" fill="#FF5F56"/>
  <circle cx="39" cy="22" r="4.5" fill="#FFBD2E"/>
  <circle cx="54" cy="22" r="4.5" fill="#27C93F"/>
  <text x="70" y="27" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#22D3EE">assistente pessoal</text>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#30363D"/>
  <text x="28" y="84" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#F0F6FC">AlfrênIA</text>
  <text x="28" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C9D1D9">Assistente pessoal com 14 especialistas e mais de 280</text>
  <text x="28" y="147" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C9D1D9">ferramentas — agenda, e-mail, finanças, estudo,</text>
  <text x="28" y="174" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C9D1D9">conteúdo e painéis — pelo Telegram, por painel web e</text>
  <text x="28" y="201" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C9D1D9">por voz.</text>
  <text x="28" y="238" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C9D1D9">Corrige a si mesma: a correção nasce numa cópia</text>
  <text x="28" y="265" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C9D1D9">isolada e só entra no ar depois de 96 verificações</text>
  <text x="28" y="292" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C9D1D9">automáticas.</text>
  <rect x="28" y="335" width="100" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
  <text x="38" y="354" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C9D1D9">TypeScript</text>
  <rect x="136" y="335" width="76" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
  <text x="146" y="354" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C9D1D9">Node.js</text>
  <rect x="220" y="335" width="68" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
  <text x="230" y="354" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C9D1D9">SQLite</text>
  <rect x="296" y="335" width="52" height="28" rx="6" fill="#161B22" stroke="#30363D"/>
  <text x="306" y="354" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#C9D1D9">LLMs</text>
