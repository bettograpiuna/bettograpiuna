  <text x="28" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C9D1D9">Eu defino o problema, as regras e a forma de conferir;</text>
  <text x="28" y="147" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C9D1D9">os agentes de programação escrevem o código dentro</text>
