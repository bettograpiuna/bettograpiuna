<svg xmlns="http://www.w3.org/2000/svg" width="600" height="385" viewBox="0 0 600 385" role="img" aria-label="Jev na AlfrênIA. Modelo especializado em decisão que escolhe qual especialista responde cada mensagem. Roda em sombra: decide junto com o roteador atual, mas só é medido. Entra em produção apenas se superar o atual numa régua escrita em código — acerto, economia, tempo e erro. (modo sombra, régua em código)">
