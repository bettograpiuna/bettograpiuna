<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="José Roberto Ramos — Gerente Geral no Banco do Brasil · IA aplicada à gestão">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0F1B2D"/>
    </linearGradient>
    <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363D" stroke-width="1" opacity="0.35"/>
    </pattern>
    <radialGradient id="brilho">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="12" fill="url(#fundo)"/>
  <rect width="1200" height="320" rx="12" fill="url(#grade)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="12" fill="none" stroke="#30363D"/>

