<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-label="Método: o prompt pede, o código garante. Regra que vive só no prompt é sugestão; sob pressão, o modelo a abandona. 01. Número vem de código: nunca de leitura; conferido por um segundo caminho. 02. Regra ganha trava: se o modelo ignorar, alguém percebe. 03. A IA não se autoaprova: veredito estruturado; quem decide é o código. 04. Verificação antes do ar: em cópia isolada; se falhar, a versão anterior volta.">
<defs><linearGradient id="grad-texto" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4B5FD"/><stop offset="0.55" stop-color="#5EEAD4"/><stop offset="1" stop-color="#FCD34D"/></linearGradient><linearGradient id="grad-tec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#D9F99D"/></linearGradient><linearGradient id="superficie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151C2C"/><stop offset="1" stop-color="#0E1320"/></linearGradient><filter id="desfoque" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter><pattern id="pontos" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" opacity="0.07"/></pattern><radialGradient id="brilho-violeta" cx="1" cy="0" r="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/><stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.06"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="brilho-turquesa" cx="1" cy="0" r="1"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.30"/><stop offset="0.55" stop-color="#14B8A6" stop-opacity="0.06"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient><radialGradient id="brilho-rosa" cx="1" cy="0" r="1"><stop offset="0" stop-color="#F43F5E" stop-opacity="0.30"/><stop offset="0.55" stop-color="#F43F5E" stop-opacity="0.06"/><stop offset="1" stop-color="#F43F5E" stop-opacity="0"/></radialGradient><radialGradient id="brilho-lima" cx="1" cy="0" r="1"><stop offset="0" stop-color="#84CC16" stop-opacity="0.30"/><stop offset="0.55" stop-color="#84CC16" stop-opacity="0.06"/><stop offset="1" stop-color="#84CC16" stop-opacity="0"/></radialGradient><radialGradient id="brilho-ambar" cx="1" cy="0" r="1"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.30"/><stop offset="0.55" stop-color="#F59E0B" stop-opacity="0.06"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient><radialGradient id="brilho-ceu" cx="1" cy="0" r="1"><stop offset="0" stop-color="#0EA5E9" stop-opacity="0.30"/><stop offset="0.55" stop-color="#0EA5E9" stop-opacity="0.06"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient><radialGradient id="brilho-laranja" cx="1" cy="0" r="1"><stop offset="0" stop-color="#F97316" stop-opacity="0.30"/><stop offset="0.55" stop-color="#F97316" stop-opacity="0.06"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient><linearGradient id="grad-linha" gradientUnits="userSpaceOnUse" x1="0" y1="252.7" x2="0" y2="580.3"><stop offset="0.00" stop-color="#C4B5FD"/><stop offset="0.33" stop-color="#5EEAD4"/><stop offset="0.67" stop-color="#FCD34D"/><stop offset="1.00" stop-color="#D9F99D"/></linearGradient></defs>
<defs><clipPath id="recorte"><rect width="480" height="660" rx="24"/></clipPath></defs>
<rect width="480" height="660" rx="24" fill="#0A0D14"/>
<g clip-path="url(#recorte)">
<circle cx="432.0" cy="627.0" r="144.0" fill="#0D9488" opacity="0.3" filter="url(#desfoque)"/>
<circle cx="38.4" cy="26.4" r="115.2" fill="#7C3AED" opacity="0.25" filter="url(#desfoque)"/>
<rect width="480" height="660" fill="url(#pontos)"/></g>
<rect x="0.5" y="0.5" width="479" height="659" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
<text x="26.0" y="56.6" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#F5F7FB" text-anchor="start" letter-spacing="-1">O prompt pede.</text>
<text x="26.0" y="98.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="url(#grad-texto)" text-anchor="start" letter-spacing="-1">O código garante.</text>
<text x="26.0" y="135.6" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#A6B0C3" text-anchor="start">Regra que vive só no prompt é sugestão —</text>
<text x="26.0" y="163.1" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#A6B0C3" text-anchor="start">sob pressão, o modelo a abandona. Por</text>
<text x="26.0" y="190.7" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#A6B0C3" text-anchor="start">isso:</text>
<text x="96.0" y="252.7" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#F5F7FB" text-anchor="start">Número vem de código</text>
<text x="96.0" y="279.3" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#A6B0C3" text-anchor="start">nunca de leitura; conferido por</text>
<text x="96.0" y="305.9" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#A6B0C3" text-anchor="start">um segundo caminho</text>
<text x="96.0" y="361.9" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#F5F7FB" text-anchor="start">Regra ganha trava</text>
<text x="96.0" y="388.5" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#A6B0C3" text-anchor="start">se o modelo ignorar, alguém</text>
<text x="96.0" y="415.1" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#A6B0C3" text-anchor="start">percebe</text>
<text x="96.0" y="471.1" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#F5F7FB" text-anchor="start">A IA não se autoaprova</text>
<text x="96.0" y="497.7" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#A6B0C3" text-anchor="start">veredito estruturado; quem decide</text>
<text x="96.0" y="524.3" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#A6B0C3" text-anchor="start">é o código</text>
<text x="96.0" y="580.3" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#F5F7FB" text-anchor="start">Verificação antes do ar</text>
<text x="96.0" y="606.9" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#A6B0C3" text-anchor="start">em cópia isolada; se falhar, a</text>
<text x="96.0" y="633.5" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#A6B0C3" text-anchor="start">versão anterior volta</text>
<line x1="50" y1="252.7" x2="50" y2="580.3" stroke="url(#grad-linha)" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/></line>
