<circle cx="50" cy="580.2500000000001" r="34" fill="#84CC16" opacity="0.12"/><circle cx="50" cy="580.2500000000001" r="22" fill="#0A0D14" stroke="#84CC16" stroke-width="2"/><text x="50.0" y="586.1" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="17.5" font-weight="700" fill="#D9F99D" text-anchor="middle">04</text>
