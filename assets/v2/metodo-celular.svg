<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-label="Método: o prompt pede, o código garante. Regra que vive só no prompt é sugestão; sob pressão, o modelo a abandona. 01. Número vem de código: nunca de leitura; conferido por um segundo caminho. 02. Regra ganha trava: se o modelo ignorar, alguém percebe. 03. A IA não se autoaprova: veredito estruturado; quem decide é o código. 04. Verificação antes do ar: em cópia isolada; se falhar, a versão anterior volta.">
<defs><linearGradient id="grad-texto" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4B5FD"/><stop offset="0.55" stop-color="#5EEAD4"/><stop offset="1" stop-color="#FCD34D"/></linearGradient><linearGradient id="grad-tec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#D9F99D"/></linearGradient><linearGradient id="superficie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151C2C"/><stop offset="1" stop-color="#0E1320"/></linearGradient><filter id="desfoque" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter><pattern id="pontos" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" opacity="0.07"/></pattern><radialGradient id="brilho-violeta" cx="1" cy="0" r="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/><stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.06"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><radialGradient id="brilho-turquesa" cx="1" cy="0" r="1"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.30"/><stop offset="0.55" stop-color="#14B8A6" stop-opacity="0.06"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient><radialGradient id="brilho-rosa" cx="1" cy="0" r="1"><stop offset="0" stop-color="#F43F5E" stop-opacity="0.30"/><stop offset="0.55" stop-color="#F43F5E" stop-opacity="0.06"/><stop offset="1" stop-color="#F43F5E" stop-opacity="0"/></radialGradient><radialGradient id="brilho-lima" cx="1" cy="0" r="1"><stop offset="0" stop-color="#84CC16" stop-opacity="0.30"/><stop offset="0.55" stop-color="#84CC16" stop-opacity="0.06"/><stop offset="1" stop-color="#84CC16" stop-opacity="0"/></radialGradient><radialGradient id="brilho-ambar" cx="1" cy="0" r="1"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.30"/><stop offset="0.55" stop-color="#F59E0B" stop-opacity="0.06"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient><radialGradient id="brilho-ceu" cx="1" cy="0" r="1"><stop offset="0" stop-color="#0EA5E9" stop-opacity="0.30"/><stop offset="0.55" stop-color="#0EA5E9" stop-opacity="0.06"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient><radialGradient id="brilho-laranja" cx="1" cy="0" r="1"><stop offset="0" stop-color="#F97316" stop-opacity="0.30"/><stop offset="0.55" stop-color="#F97316" stop-opacity="0.06"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient><linearGradient id="grad-linha" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="564"><stop offset="0.00" stop-color="#C4B5FD"/><stop offset="0.33" stop-color="#5EEAD4"/><stop offset="0.67" stop-color="#FCD34D"/><stop offset="1.00" stop-color="#D9F99D"/></linearGradient></defs>
<defs><clipPath id="recorte"><rect width="480" height="650" rx="24"/></clipPath></defs>
<rect width="480" height="650" rx="24" fill="#0A0D14"/>
<g clip-path="url(#recorte)">
<circle cx="440" cy="620" r="140" fill="#0D9488" opacity="0.3" filter="url(#desfoque)"/>
<circle cx="40" cy="30" r="110" fill="#7C3AED" opacity="0.25" filter="url(#desfoque)"/>
<rect width="480" height="650" fill="url(#pontos)"/></g>
<rect x="0.5" y="0.5" width="479" height="649" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
<text x="30.0" y="74.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#F5F7FB" text-anchor="start" letter-spacing="-1">O prompt pede.</text>
<text x="30.0" y="118.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="url(#grad-texto)" text-anchor="start" letter-spacing="-1">O código garante.</text>
<text x="32.0" y="160.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#A6B0C3" text-anchor="start">Regra que vive só no prompt é sugestão —</text>
<text x="32.0" y="184.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#A6B0C3" text-anchor="start">sob pressão, o modelo a abandona. Por isso:</text>
<line x1="64" y1="240" x2="64" y2="564" stroke="url(#grad-linha)" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/></line>
<circle cx="64" cy="240" r="36" fill="#8B5CF6" opacity="0.12"/><circle cx="64" cy="240" r="24" fill="#0A0D14" stroke="#8B5CF6" stroke-width="2"/><text x="64.0" y="245.0" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#C4B5FD" text-anchor="middle">01</text>
<text x="108.0" y="236.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#F5F7FB" text-anchor="start">Número vem de código</text>
<text x="108.0" y="260.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#A6B0C3" text-anchor="start">nunca de leitura; conferido por um segundo caminho</text>
<circle cx="64" cy="348" r="36" fill="#14B8A6" opacity="0.12"/><circle cx="64" cy="348" r="24" fill="#0A0D14" stroke="#14B8A6" stroke-width="2"/><text x="64.0" y="353.0" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#5EEAD4" text-anchor="middle">02</text>
<text x="108.0" y="344.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#F5F7FB" text-anchor="start">Regra ganha trava</text>
<text x="108.0" y="368.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#A6B0C3" text-anchor="start">se o modelo ignorar, alguém percebe</text>
<circle cx="64" cy="456" r="36" fill="#F59E0B" opacity="0.12"/><circle cx="64" cy="456" r="24" fill="#0A0D14" stroke="#F59E0B" stroke-width="2"/><text x="64.0" y="461.0" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#FCD34D" text-anchor="middle">03</text>
<text x="108.0" y="452.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#F5F7FB" text-anchor="start">A IA não se autoaprova</text>
<text x="108.0" y="476.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#A6B0C3" text-anchor="start">veredito estruturado; quem decide é o código</text>
<circle cx="64" cy="564" r="36" fill="#84CC16" opacity="0.12"/><circle cx="64" cy="564" r="24" fill="#0A0D14" stroke="#84CC16" stroke-width="2"/><text x="64.0" y="569.0" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#D9F99D" text-anchor="middle">04</text>
<text x="108.0" y="560.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#F5F7FB" text-anchor="start">Verificação antes do ar</text>
<text x="108.0" y="584.0" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#A6B0C3" text-anchor="start">em cópia isolada; se falhar, a versão anterior volta</text>
</svg>
